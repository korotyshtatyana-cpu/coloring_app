name: coloring_app
description: Professional coloring app with advanced tools
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Modules (local)
  core:
    path: ./core
  core_ui:
    path: ./core_ui
  domain:
    path: ./domain
  data:
    path: ./data
  navigation:
    path: ./navigation
  auth:
    path: ./features/auth
  gallery:
    path: ./features/gallery
  canvas:
    path: ./features/canvas
  settings:
    path: ./features/settings

  # State management & DI
  flutter_bloc: ^8.1.4
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Navigation & localization
  auto_route: ^11.1.0
  easy_localization: ^3.0.8

  # Environment
  flutter_dotenv: ^5.1.0

  # Backend & database
  supabase_flutter: ^2.5.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0

  # Images & graphics
  flutter_svg: ^2.0.9
  image: ^4.2.0

  # Export & share
  screenshot: ^2.1.0
  share_plus: ^7.2.2
  gallery_saver: ^2.3.2

  # UI helpers
  flutter_colorpicker: ^1.0.3
  sliding_up_panel: ^2.0.0+1

  # Logging & splash
  logger: ^2.0.2+1
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8
  auto_route_generator: ^10.6.0
  drift_dev: ^2.14.0
  easy_localization_generator: ^0.3.5

flutter:
  uses-material-design: true
